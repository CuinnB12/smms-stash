<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM's Stash</title>
    <link rel="stylesheet" href="indexcss.css">
</head>
<style>
    .container {
        max-width: 100%;
        height: 200px;
        width: 200px;
        margin-left: auto;
        margin-right: auto;
        display: flex;
        flex-direction: column; 
    }
    img {
      display: block;
    }
    img + img {
      margin-top: 20px; 
    }

</style>
<body>
    <div class="container">
        <img src="cat0.jpg" alt="cat 0" style="max-width: 100%; height: auto; display: block; margin-left: auto; margin-right: auto;">
        <img src="cat1.jpg" alt="cat 1" style="max-width: 100%; height: auto; display: block; margin-left: auto; margin-right: auto;">
    </div>
</body>
</html>
